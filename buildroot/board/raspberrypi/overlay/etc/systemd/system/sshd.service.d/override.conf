# network-online.target bloque sur NetworkManager-wait-online (aucune interface
# geree : end0 est a systemd-networkd). sshd doit demarrer sans attendre.
[Unit]
After=
After=network.target auditd.service
Wants=

# Les ExecStartPre "chmod ssh_host_*_key" amont echouent toujours : systemd ne
# developpe pas les globs, chmod recoit le motif litteral et sort en erreur.
# ssh-keygen -A cree deja les cles en 600.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
